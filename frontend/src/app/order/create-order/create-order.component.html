<h1 translate="order.create-order.title"></h1>

@if (accessionHolders(); as accessionHolders) {
  <div class="content mb-2">
    <form [formRoot]="form">
      @if (accessionHolders.length > 1) {
        <div class="mb-3">
          <label class="form-label" for="accession-holder" translate="order.create-order.accession-holder"></label>
          <select [formField]="form.accessionHolderId" id="accession-holder" class="form-select">
            <option value=""></option>
            @for (accessionHolder of accessionHolders; track accessionHolder.id) {
              <option [value]="accessionHolder.id">{{ accessionHolder.grc.name }} &ndash; {{ accessionHolder.name }}</option>
            }
          </select>
          <val-signal-errors [formField]="form.accessionHolderId" [label]="'order.create-order.accession-holder-error-label' | translate" />
        </div>
      }

      <div>
        <div class="mb-3">
          <label class="form-label" for="name" translate="order.edit-customer-information.name"></label>
          <input [formField]="form.customer.name" id="name" class="form-control" />
          <val-signal-errors [formField]="form.customer.name" [label]="'order.create-order.name-error-label' | translate" />
        </div>
        <div class="mb-3">
          <label class="form-label" for="organization" translate="order.create-order.organization"></label>
          <input [formField]="form.customer.organization" id="organization" class="form-control" />
        </div>
        <div class="mb-3">
          <label class="form-label" for="email" translate="order.create-order.email"></label>
          <input type="email" [formField]="form.customer.email" id="email" class="form-control" />
          <val-signal-errors [formField]="form.customer.email" [label]="'order.create-order.email-error-label' | translate" />
        </div>
        <div class="mb-3">
          <label class="form-label" for="delivery-address" translate="order.create-order.delivery-address"></label>
          <textarea [formField]="form.customer.deliveryAddress" id="delivery-address" class="form-control"></textarea>
          <val-signal-errors
            [formField]="form.customer.deliveryAddress"
            [label]="'order.create-order.delivery-address-error-label' | translate"
          />
        </div>
        <div class="mb-3">
          <label class="form-label" for="billing-address" translate="order.create-order.billing-address"></label>
          <div class="form-check form-switch" [class.mb-2]="!form.useDeliveryAddress().value()">
            <input [formField]="form.useDeliveryAddress" type="checkbox" class="form-check-input" id="use-delivery-address" />
            <label class="form-check-label" for="use-delivery-address" translate="order.create-order.use-delivery-address"></label>
          </div>
          <div [ngbCollapse]="form.useDeliveryAddress().value()">
            <textarea [formField]="form.customer.billingAddress" id="billing-address" class="form-control"></textarea>
          </div>
          <val-signal-errors
            [formField]="form.customer.billingAddress"
            [label]="'order.create-order.billing-address-error-label' | translate"
          />
        </div>
        <div class="mb-3">
          <label class="form-label" for="type" translate="order.create-order.customer-type"></label>
          <select [formField]="form.customer.type" id="type" class="form-select">
            <option value=""></option>
            @for (customerType of customerTypes; track customerType) {
              <option [value]="customerType">{{ customerType | customerTypeEnum }}</option>
            }
          </select>
          <val-signal-errors [formField]="form.customer.type" [label]="'order.create-order.customer-type-error-label' | translate" />
        </div>
        <div class="mb-3">
          <label class="form-label" for="language" translate="order.create-order.language"></label>
          <select [formField]="form.customer.language" id="language" class="form-select">
            <option value=""></option>
            @for (language of languages; track language) {
              <option [value]="language">{{ language | languageEnum }}</option>
            }
          </select>
          <val-signal-errors [formField]="form.customer.language" [label]="'order.create-order.language-error-label' | translate" />
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="rationale" translate="order.create-order.rationale"></label>
        <textarea [formField]="form.rationale" id="rationale" class="form-control"></textarea>
      </div>
      <div class="text-end">
        <button class="btn btn-primary me-2" translate="order.create-order.save" id="save-button"></button>
        <button type="button" class="btn btn-danger" (click)="cancel()" translate="order.create-order.cancel" id="cancel-button"></button>
      </div>
    </form>
  </div>
}
